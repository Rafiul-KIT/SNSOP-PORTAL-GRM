<div class="breadcrumb-wrapper">
  <p-breadcrumb class="w-100" [model]="items" [home]="home"></p-breadcrumb>
</div>

<div class="container-fluid mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-light d-flex justify-content-between align-items-center">
      <h4 class="mb-0">Grievance Status Report</h4>
      <button class="btn btn-primary" (click)="downloadReport()">
        <i class="fas fa-download me-2"></i> Download Report
      </button>
    </div>
    <div class="card-body">
      <p-tabs value="0">
        <p-tablist>
          <p-tab value="0">Type of Grievance by County</p-tab>
          <p-tab value="1">Average Days to Close by County</p-tab>
          <p-tab value="2">Grievance by Status</p-tab>
        </p-tablist>
        <p-tabpanels>
          <p-tabpanel value="0">
            <p-table [value]="grievanceByCounty" [tableStyle]="{'min-width': '50rem'}">
              <ng-template pTemplate="header">
                <tr>
                  <th>County - Type</th>
                  <th class="text-end">Total</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-county>
                <tr>
                  <td>{{ county.name }}</td>
                  <td class="text-end">{{ county.total }}</td>
                </tr>
              </ng-template>
            </p-table>
          </p-tabpanel>
          <p-tabpanel value="1">
            <p-table [value]="averageDaysByCounty" [tableStyle]="{'min-width': '50rem'}">
              <ng-template pTemplate="header">
                <tr>
                  <th>County - Type</th>
                  <th class="text-end">Avg Days to Close</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-county>
                <tr>
                  <td>{{ county.name }}</td>
                  <td class="text-end">{{ county.avgDays }}</td>
                </tr>
              </ng-template>
            </p-table>
          </p-tabpanel>
          <p-tabpanel value="2">
            <p-table [value]="grievanceByStatus" [tableStyle]="{'min-width': '50rem'}">
              <ng-template pTemplate="header">
                <tr>
                  <th>Status - Type</th>
                  <th class="text-end">Total</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-status>
                <tr>
                  <td>{{ status.type }}</td>
                  <td class="text-end">{{ status.total }}</td>
                </tr>
              </ng-template>
            </p-table>
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
    </div>
  </div>
</div>
