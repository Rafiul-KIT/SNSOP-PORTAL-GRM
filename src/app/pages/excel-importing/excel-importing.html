<div class="breadcrumb-wrapper">
  <p-breadcrumb class="w-100" [model]="items" [home]="home"></p-breadcrumb>
</div>
<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-light">
      <h4 class="mb-0">Excel Data Import</h4>
    </div>
    <div class="card-body">

      <!-- Step 1: Select and Download Template -->
      <div class="step-section">
        <h5><i class="bi bi-1-circle-fill text-primary me-2"></i> Select & Download Template</h5>
        <hr>
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="templateGrievanceType" class="form-label fw-bold">Template Type</label>
              <select
                class="form-select"
                id="templateGrievanceType"
                name="templateGrievanceType"
                [ngModel]="templateGrievanceType"
                (ngModelChange)="onTemplateGrievanceTypeChange($event)"
              >
                <option value="" disabled>-- Select a template type --</option>
                @for (type of grievanceTypeOptions; track type.value) {
                  <option [value]="type.value">{{ type.label }}</option>
                }
              </select>
            </div>
          </div>
          <div class="col-md-6 d-flex align-items-end">
            <button class="btn btn-primary w-100" (click)="downloadTemplate()" [disabled]="!templateGrievanceType || isTemplateDownloading">
              @if (!isTemplateDownloading) {
                <span><i class="bi bi-download me-2"></i> Download Template</span>
              } @else {
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                <span> Downloading...</span>
              }
            </button>
          </div>
        </div>
      </div>

      <!-- Step 2: Upload and Import -->
      <div class="step-section mt-4">
        <h5><i class="bi bi-2-circle-fill text-primary me-2"></i> Upload & Import</h5>
        <hr>
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label for="uploadGrievanceType" class="form-label fw-bold">Grievance Type</label>
              <select
                class="form-select"
                id="uploadGrievanceType"
                name="uploadGrievanceType"
                [ngModel]="uploadGrievanceType"
                (ngModelChange)="onUploadGrievanceTypeChange($event)"
              >
                <option value="" disabled>-- Select grievance type --</option>
                @for (type of grievanceTypeOptions; track type.value) {
                  <option [value]="type.value">{{ type.label }}</option>
                }
              </select>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label for="fileInput" class="form-label fw-bold">Upload Excel File</label>
              <input type="file" class="form-control" id="fileInput" (change)="onFileChange($event)" accept=".xlsx, .xls">
            </div>
          </div>
          <div class="col-md-4 d-flex align-items-end gap-2">
            <button class="btn btn-success flex-fill" (click)="onImport()" [disabled]="getImportButtonDisabledState()">
              @if (!isImporting) {
                <span><i class="bi bi-check-circle-fill me-2"></i> Import Data</span>
              } @else {
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                <span> Importing...</span>
              }
            </button>
            <button class="btn btn-secondary" type="button" (click)="reset()" [disabled]="isImporting">
              <i class="bi bi-arrow-repeat me-2"></i> Reset
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
